[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elasticmind-loadgen"
version = "0.1.0"
description = "ElasticMind load generator: async HTTP traffic replay"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8", "black>=24.10"]

[tool.setuptools.packages.find]
include = ["loadgen*"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.black]
line-length = 100
