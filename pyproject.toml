[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elasticmind"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "node_modules"]

[tool.black]
line-length = 100
extend-exclude = "frontend"

[tool.pytest.ini_options]
testpaths = ["ml/tests", "backend/tests", "loadgen/tests", "target_app/tests", "gateway/tests", "experiments/tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    "B008",  # FastAPI Depends/Query in argument defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["F401", "F811"]
