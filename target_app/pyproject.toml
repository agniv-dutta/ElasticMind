[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elasticmind-target-app"
version = "0.1.0"
description = "ElasticMind target application being scaled"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "black>=24.10"]

[tool.setuptools.packages.find]
include = ["target_app*"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.black]
line-length = 100
