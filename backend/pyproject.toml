[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elasticmind-backend"
version = "0.1.0"
description = "ElasticMind backend: FastAPI, autoscaler, simulator, SQLite"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "elasticmind-ml",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8", "black>=24.10", "moto[ecs,cloudwatch,s3]>=5.0"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.black]
line-length = 100
