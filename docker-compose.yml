name: elasticmind

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    image: elasticmind-backend:local
    ports:
      - "8000:8000"
    environment:
      ELASTICMIND_ENV: docker
      ELASTICMIND_DB_URL: sqlite:////data/elasticmind.db
      TARGET_APP_BASE_URL: http://target_app:8001
      ELASTICMIND_MODEL_PATH: /models/lightgbm_multihorizon.joblib
    volumes:
      - backend-data:/data
      - ./ml/models/artifacts:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=3).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    image: elasticmind-frontend:local
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE: /api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  target_app:
    build:
      context: .
      dockerfile: infra/docker/target_app.Dockerfile
    image: elasticmind-target-app:local
    ports:
      - "8001:8001"
    environment:
      TARGET_APP_PORT: "8001"
      TARGET_APP_CPU_BURN_MS: "40"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health', timeout=3).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  loadgen:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: infra/docker/loadgen.Dockerfile
    image: elasticmind-loadgen:local
    environment:
      LOADGEN_BACKEND_URL: http://backend:8000
      LOADGEN_TARGET_URL: http://target_app:8001
      LOADGEN_PROFILE: diurnal
      LOADGEN_DAYS: "1"
      LOADGEN_SPEED_FACTOR: "20"
      LOADGEN_TRACE: /data/generated/diurnal.parquet
    volumes:
      - ./ml/data:/data:ro
    depends_on:
      backend:
        condition: service_healthy
      target_app:
        condition: service_healthy

volumes:
  backend-data:
