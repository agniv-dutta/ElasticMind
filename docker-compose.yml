name: elasticmind

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    image: elasticmind-backend:local
    ports:
      - "8000:8000"
    environment:
      ELASTICMIND_ENV: docker
      ELASTICMIND_DB_URL: sqlite:////data/elasticmind.db
      ELASTICMIND_PROFILE: local_demo
      ELASTICMIND_GATEWAY_URL: http://gateway:8001
    volumes:
      - backend-data:/data
      - ./ml/models/artifacts:/app/ml/models/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=3).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      gateway:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_BASE: /api
    image: elasticmind-frontend:local
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy


  gateway:
    build:
      context: .
      dockerfile: infra/docker/gateway.Dockerfile
    image: elasticmind-gateway:local
    ports:
      - "8001:8001"
    environment:
      GATEWAY_BACKEND_URL: http://backend:8000
      GATEWAY_INITIAL_REPLICAS: "1"
      GATEWAY_CPU_BURN_MS: "40"
      GATEWAY_CAPACITY_PER_REPLICA_RPM: "500"
      GATEWAY_METRICS_INTERVAL_S: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health', timeout=3).raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  loadgen:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: infra/docker/loadgen.Dockerfile
    image: elasticmind-loadgen:local
    environment:
      LOADGEN_PROFILE: local_demo
      LOADGEN_BACKEND_URL: http://backend:8000
      LOADGEN_TARGET_URL: http://gateway:8001
      ELASTICMIND_TIME_SCALE: "20"
      LOADGEN_DAYS: "1"
    depends_on:
      backend:
        condition: service_healthy
      gateway:
        condition: service_healthy

volumes:
  backend-data:
