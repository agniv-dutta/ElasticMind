[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elasticmind-gateway"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["gateway*"]
